# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-load-balancing-acl"
version = "0.0.1"
description = "Host/SNI/path → backend-pool routing rules (HAProxy ACLs) for netbox_load_balancing"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Jameson" }]
keywords = ["netbox", "netbox-plugin", "load-balancing", "haproxy", "acl", "routing"]
# PEP 639: the SPDX `license` expression above is authoritative; a `License ::`
# classifier alongside it is rejected by setuptools>=77, so it is intentionally omitted.
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
dependencies = ["netbox-load-balancing"]

[project.urls]
Repository = "https://github.com/JamesonRGrieve/netbox-load-balancing-acl"

[tool.setuptools.packages.find]
include = ["netbox_load_balancing_acl*"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netbox.settings"
python_files = ["test_*.py"]
addopts = "-v"
